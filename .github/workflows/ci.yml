name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows 优先（docs/02 §1）。点击穿透与免打扰探测都是 Windows 专有实现，
    # 在 Linux 跑 CI 只会掩盖真正会出问题的地方。
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # docs/09 §9.1 建议把资源验收做成 CI 门禁：素材是生成件，
      # 改了生成代码却忘记重出图集时，这一步会立刻发现帧数与图集宽度不一致
      - name: Verify assets
        run: pnpm verify:assets

      # 构建产物本身就是一次冒烟：三个渲染入口、preload、主进程都得能打出来
      - name: Build
        run: pnpm electron-vite build
