# electron-builder 打包配置（Windows：NSIS 安装包 + 免安装 portable，docs/02 §1）
#
# 三条与本项目强相关、改之前先看的：
#
# 1. **`npmRebuild: false` 是刻意的。** better-sqlite3 从 v13 起随包发 N-API 预编译产物
#    （`node_modules/better-sqlite3/prebuilds/win32-x64.node`），N-API 与 ABI 无关，
#    在 Electron 43 下**不需要 electron-rebuild**（已实测：electron 里 require 得到、能建表能查）。
#    `pnpm-workspace.yaml` 跳过它的默认构建也是同一个原因。
#    哪天它换回 NAN，或者换了别的原生模块，这里要改回 true 并准备好 MSVC 工具链。
# 2. **`.node` 必须从 asar 里解出来**（`asarUnpack`）：asar 里的动态库 dlopen 不了。
# 3. **`resources/` 要原样进 `process.resourcesPath/resources`**：
#    `src/main/resources.ts` 的 `resourcesRoot()` 就是这么找托盘图标与节假日表的，
#    路径对不上会走兜底托盘图标的降级路径 —— 能跑，但看起来像资源丢了。

appId: com.gppet.desktop
productName: GP Pet
copyright: GP Pet

directories:
  output: release
  buildResources: resources/icons/app

# out/ 是 electron-vite 的产物；node_modules 里的 production 依赖由 electron-builder 自行收集。
#
# **逐个列出三个入口目录，不写 `out/**`。** `out/` 下不只有运行时产物：
# 三个 tsconfig 的 `outDir` 也在那儿（`out/types/*.tsbuildinfo`，约 220 KB），
# 那是 TypeScript 的增量构建元数据，里面记着**全部源文件与测试文件的清单**。
# 装到用户机器上毫无用处，而 `out/**` 会把它一起扫进 asar。
# 写成白名单还有一层好处：日后谁再往 `out/` 下加个中间产物目录，不会静默地跟着进包。
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  - '!**/*.map'
  # better-sqlite3 随包发 8 个平台的 N-API 预编译产物（各约 2 MB）。
  # 本项目只出 win x64，另外 7 个是纯死重量 —— `lib/binding.js` 按
  # `process.platform`-`process.arch` 拼文件名，运行时只会去找 win32-x64.node。
  # **改 win.target 的架构时这一行要一起改**，否则会打出一个找不到 .node 的包。
  #
  # ⚠ 必须写成**排除式**的 extglob（`!(win32-x64)`），不能写成
  # 「先排除整个目录，再正向列出 win32-x64.node」那两行 —— 只要 `files` 里出现一条
  # **正向的 `node_modules/...` 条目**，electron-builder 26 就会走另一条依赖收集路径，
  # 并把**源码树里的 `package.json` 原地改写**（`scripts` 与 `devDependencies` 整块删掉）。
  # 那不是打包产物被改，是仓库被改，`git checkout -- package.json` 才能恢复。实测踩过一次。
  - '!node_modules/better-sqlite3/prebuilds/!(win32-x64).node'
  # `deps/`（sqlite3.c 合并源码 + gyp 配置，约 10 MB）与 `src/`（C++ 源）只在
  # **从源码编译**时用得到，而文件头第 1 条说了 `npmRebuild: false`：我们用预编译产物。
  # 这两条与那一条是配套的 —— 哪天改回 `npmRebuild: true`，这里要一起删。
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'

# `resources/` 原样进 `process.resourcesPath/resources`（见文件头第 3 条），
# 但**两类给开发者看的文件不进**：README 是写给改代码的人的，`.gitkeep` 是占位符。
# 不排除它们不会出错，只是让用户的安装目录里多两个解释不了的文件。
extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'
      - '!**/README.md'
      - '!**/.gitkeep'

asar: true
asarUnpack:
  - '**/*.node'

# 见文件头第 1 条
npmRebuild: false

# 直接用 node_modules 里那份**已经解压好**的 Electron（就是 `pnpm dev` 跑的那一份，
# 版本同样由 package.json 的 electron 决定）。
#
# 这不是为了省下载：默认路径是「下载 zip → 解压到 release/win-unpacked.tmp → rename 成
# release/win-unpacked」，而 Windows 上刚落盘的几百个 exe/dll 会被 Defender 一类的东西
# 按住句柄，那个 rename 于是**间歇性** EPERM（同一份配置，跑三次成一次）。
# 指向已解压目录后整条「解压 + rename」都不发生，这个失败模式随之消失。
electronDist: node_modules/electron/dist

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icons/app/icon.ico
  # 没有代码签名证书：安装时 SmartScreen 会拦一次「未知发布者」，属预期
  artifactName: gp-pet-${version}-${arch}.${ext}

nsis:
  # 走带界面的安装流程而不是 oneClick：自用工具也该让人看清装到哪、能不能改路径
  oneClick: false
  perMachine: false # 每用户安装 → 不弹 UAC
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GP Pet
  installerIcon: resources/icons/app/icon.ico
  uninstallerIcon: resources/icons/app/icon.ico
  # 卸载时**不**删数据目录：自选、持仓、信号历史都在 %APPDATA%/GP Pet 下，
  # 静默删掉用户自己录进去的持仓成本是不可逆的
  deleteAppDataOnUninstall: false
  artifactName: gp-pet-${version}-setup-${arch}.${ext}

portable:
  artifactName: gp-pet-${version}-portable-${arch}.${ext}
