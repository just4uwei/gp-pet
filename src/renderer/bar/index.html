<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP：禁止一切远程来源。悬浮条不加载任何图片资源（这是它相对桌宠形态的好处之一
      —— 默认形态不依赖美术素材），但 res: 仍放行，因为切到桌宠形态用的是同一份 preload。
      script-src 的 'unsafe-inline' 是 Vite 注入内联引导脚本所需。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' res: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'"
    />
    <title>GP Pet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
